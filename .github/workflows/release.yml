name: Release & Packaging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases (otherwise packages are kept as build artifacts)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create draft release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run verification checks
        run: ./gradlew check checkDataModels --no-daemon

  build:
    name: Package (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: umimuko-music-windows
            build-cmd: .\gradlew.bat packageDistributionForCurrentOS checkDataModels
            artifact-path: build/compose/binaries/main/*/*.msi
            extra-artifact-path: build/compose/binaries/main/*/*.exe

          - os: macos-latest
            artifact-name: umimuko-music-macos
            build-cmd: ./gradlew packageDmg checkDataModels
            artifact-path: build/compose/binaries/main/dmg/*.dmg
            extra-artifact-path: ''

          - os: ubuntu-latest
            artifact-name: umimuko-music-linux
            build-cmd: ./gradlew packageDistributionForCurrentOS packageArchLinux checkDataModels
            artifact-path: build/compose/binaries/main/*/*.deb
            extra-artifact-path: |
              build/compose/binaries/main/*/*.rpm
              build/compose/binaries/main/arch/*.pkg.tar.zst

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc rpm zstd

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install --cask vlc

      - name: Build application packages
        run: ${{ matrix.build-cmd }}

      - name: Upload packages as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-path }}
            ${{ matrix.extra-artifact-path }}
          if-no-files-found: warn

  publish:
    name: Publish Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || github.event.inputs.publish_release == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sed 's|  \./|  |' | sort -k 2 > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' || inputs.draft == true }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || inputs.prerelease == true || contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
