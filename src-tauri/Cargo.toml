[package]
name = "umimuko-music"
version = "0.26.1"
description = "Umimuko Music desktop audio player"
authors = ["Umimuko"]
edition = "2021"

[lib]
name = "umimuko_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
symphonia = { version = "0.5", features = ["mp3", "flac", "aac", "alac", "ogg", "vorbis", "wav", "pcm"] }
cpal = "0.15"
biquad = "0.4"
ringbuf = "0.4"
lofty = "0.22"
image = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
souvlaki = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
quick-xml = "0.37"
dirs = "5"
thiserror = "2"
tracing = "0.1"
