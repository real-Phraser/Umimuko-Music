name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
            distribution: zulu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution || 'temurin' }}
          java-version: 17
          architecture: ${{ matrix.arch }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install --cask vlc

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Run test suite and model verification
        if: runner.os != 'Windows'
        run: ./gradlew check checkDataModels --no-daemon --stacktrace

      - name: Run test suite and model verification (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat check checkDataModels --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
