name: Build Multiplatform Binaries

on:
  push:
    branches:
      - main
      - feat/*
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: umimuko-music-windows
            build-cmd: .\gradlew.bat packageDistributionForCurrentOS checkDataModels
            artifact-path: build/compose/binaries/main/*/*.msi
            extra-artifact-path: build/compose/binaries/main/*/*.exe

          - os: macos-latest
            artifact-name: umimuko-music-macos
            build-cmd: ./gradlew packageDmg checkDataModels
            artifact-path: build/compose/binaries/main/dmg/*.dmg

          - os: ubuntu-latest
            artifact-name: umimuko-music-linux
            build-cmd: ./gradlew packageDistributionForCurrentOS packageArchLinux checkDataModels
            artifact-path: build/compose/binaries/main/*/*.deb
            extra-artifact-path: |
              build/compose/binaries/main/*/*.rpm
              build/compose/binaries/main/arch/*.pkg.tar.zst

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc rpm zstd

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install --cask vlc

      - name: Build application binaries
        run: ${{ matrix.build-cmd }}

      - name: Upload binaries as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-path }}
            ${{ matrix.extra-artifact-path }}
          if-no-files-found: warn

  release:
    name: Publish Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
