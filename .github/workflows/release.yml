name: Release & Packaging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.23.0). If empty, inferred from git tag or build.gradle.kts'
        required: false
        type: string
      publish_release:
        description: 'Publish to GitHub Releases (otherwise packages are kept as build artifacts)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create draft release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run verification checks
        run: ./gradlew check checkDataModels --no-daemon

  build:
    name: Package (${{ matrix.artifact-name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact-name: umimuko-music-windows-x64
            build-cmd: .\gradlew.bat packageDistributionForCurrentOS checkDataModels
            artifact-path: build/compose/binaries/main/*/*.msi
            extra-artifact-path: build/compose/binaries/main/*/*.exe

          - os: windows-11-arm
            arch: arm64
            distribution: zulu
            artifact-name: umimuko-music-windows-arm64
            build-cmd: .\gradlew.bat packageDistributionForCurrentOS checkDataModels
            artifact-path: build/compose/binaries/main/*/*.msi
            extra-artifact-path: build/compose/binaries/main/*/*.exe

          - os: macos-latest
            arch: arm64
            artifact-name: umimuko-music-macos-arm64
            build-cmd: ./gradlew packageDmg checkDataModels
            artifact-path: build/compose/binaries/main/dmg/*.dmg
            extra-artifact-path: ''

          - os: macos-latest
            arch: x64
            artifact-name: umimuko-music-macos-x64
            build-cmd: ./gradlew packageDmg checkDataModels
            artifact-path: build/compose/binaries/main/dmg/*.dmg
            extra-artifact-path: ''

          - os: ubuntu-latest
            arch: x64
            artifact-name: umimuko-music-linux-x64
            build-cmd: ./gradlew packageDistributionForCurrentOS packageArchLinux checkDataModels
            artifact-path: build/compose/binaries/main/*/*.deb
            extra-artifact-path: |
              build/compose/binaries/main/*/*.rpm
              build/compose/binaries/main/arch/*.pkg.tar.zst

          - os: ubuntu-24.04-arm
            arch: arm64
            artifact-name: umimuko-music-linux-arm64
            build-cmd: ./gradlew packageDistributionForCurrentOS packageArchLinux checkDataModels
            artifact-path: build/compose/binaries/main/*/*.deb
            extra-artifact-path: |
              build/compose/binaries/main/*/*.rpm
              build/compose/binaries/main/arch/*.pkg.tar.zst

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution || 'temurin' }}
          java-version: 17
          architecture: ${{ matrix.arch }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc rpm zstd

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install --cask vlc

      - name: Build application packages
        run: ${{ matrix.build-cmd }}

      - name: Add architecture tag to packages
        shell: bash
        run: |
          find build/compose/binaries/main -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) 2>/dev/null | while read -r f; do
            [ -n "$f" ] || continue
            fname=$(basename "$f")
            ext="${fname##*.}"
            base="${fname%.*}"
            if [[ "$fname" != *"${{ matrix.arch }}"* ]]; then
              new_name="${base}-${{ matrix.arch }}.${ext}"
              mv "$f" "$(dirname "$f")/$new_name"
              echo "Renamed $fname to $new_name"
            fi
          done

      - name: Upload packages as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-path }}
            ${{ matrix.extra-artifact-path }}
          if-no-files-found: warn

  publish:
    name: Publish Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || github.event.inputs.publish_release == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version = ' build.gradle.kts | head -n1 | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: 'umimuko-music-*'
          path: artifacts
          merge-multiple: true

      - name: Flatten packages and generate SHA-256 Checksums
        run: |
          find artifacts -mindepth 2 -type f -exec mv -f {} artifacts/ \;
          find artifacts -mindepth 1 -type d -empty -delete
          cd artifacts
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f -exec sha256sum {} + | sed 's|  \./|  |' | sort -k 2 > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: |
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg.tar.zst
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' || inputs.draft == true }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || inputs.prerelease == true || contains(steps.release_tag.outputs.tag, '-alpha') || contains(steps.release_tag.outputs.tag, '-beta') || contains(steps.release_tag.outputs.tag, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
